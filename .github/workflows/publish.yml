name: Publish

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      # Use the npm bundled with Node. `npm@latest` (v11+) removed `--git-checks`, which
      # `changeset publish` still passes and breaks OIDC publishes.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # Some package builds rewrite tracked bundles (e.g. vscode-a11y server); changesets checks out a branch and needs a clean tree.
      - run: git checkout -- .

      - uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
          title: 'chore: release packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
